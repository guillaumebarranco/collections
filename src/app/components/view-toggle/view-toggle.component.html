<div class="view-toggle-desktop" [ngClass]="toggleClass">
  @for (option of options; track option.value) {
  <button
    class="toggle-option"
    [class.active]="selected === option.value"
    (click)="select(option.value)"
  >
    {{ option.label }}
  </button>
  }
</div>

<div class="view-toggle-mobile">
  @for (option of options; track option.value) {
  <button
    class="toggle-option-mobile"
    [class.active]="selected === option.value"
    (click)="select(option.value)"
  >
    {{ option.label }}
  </button>
  }
</div>
