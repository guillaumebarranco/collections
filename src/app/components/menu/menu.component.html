<nav class="menu">
  <div class="menu-container">
    <div class="menu-logo" [routerLink]="[getRoute('dashboard')]">
      <span class="logo-text">Makya</span>
      <img src="/logo.png" alt="Makya" class="logo-image" />
    </div>

    <div class="menu-items">
      @for (item of primaryMenuItems; let i = $index; track item.label) {
      <button
        class="menu-item"
        [class.active]="isActive(item.route)"
        [class.hide-on-mobile]="i > 3"
        (click)="navigateTo(item.route)"
      >
        <span class="menu-icon">{{ item.icon }}</span>
        <span class="menu-label">{{ item.label }}</span>
      </button>
      } @if (isCompactMenu && visibleMenuItems.length > 4) {
      <div class="menu-item menu-item-group" [class.open]="isReadingMenuOpen">
        <button
          class="menu-group-toggle"
          type="button"
          (click)="toggleReadingMenu()"
          [class.active]="isReadingMenuActive()"
        >
          <span class="menu-icon">📚</span>
          <span class="menu-label">Lecture</span>
          <span class="menu-caret">▾</span>
        </button>
        <div class="menu-submenu" [class.open]="isReadingMenuOpen">
          @for (item of readingMenuItems; track item.label) {
          <button
            class="menu-subitem"
            (click)="navigateTo(item.route); closeReadingMenu()"
          >
            <span class="menu-icon">{{ item.icon }}</span>
            <span class="menu-label">{{ item.label }}</span>
          </button>
          }
        </div>
      </div>
      }
    </div>
    <div class="menu-auth">
      @if (authenticatedUser()) {
      <div class="menu-user-group" [class.open]="isUserMenuOpen">
        <button
          class="menu-user makya-btn-small"
          type="button"
          (click)="toggleUserMenu()"
        >
          <span class="menu-user-mobile">👤</span>
          <span class="menu-user-username">{{ authenticatedUser() }}</span>
          <span class="menu-caret">▾</span>
        </button>
        <div
          class="menu-submenu menu-user-submenu"
          [class.open]="isUserMenuOpen"
        >
          <div class="menu-subitem menu-subitem-disabled">
            <span class="menu-label"
              >Connecté en tant que {{ authenticatedUser() }}</span
            >
          </div>
          <button class="menu-subitem" type="button" (click)="goToDashboard()">
            <span class="menu-label">Aller sur mon dashboard</span>
          </button>
          <button
            class="menu-subitem"
            type="button"
            (click)="openMenuConfigModal()"
          >
            <span class="menu-label">Configuration de mon menu</span>
          </button>
          @if (isAdmin()) {
          <button class="menu-subitem" type="button" [routerLink]="'/admin'">
            Aller sur la vue Admin
          </button>
          }
          <button class="menu-subitem" type="button" (click)="logout()">
            <span class="menu-label">Se déconnecter</span>
          </button>
        </div>
      </div>
      <span class="menu-user-mobile"></span>
      } @else {
      <button class="makya-btn-small" (click)="goToLogin()">
        Se connecter
      </button>

      }
    </div>
  </div>
</nav>
