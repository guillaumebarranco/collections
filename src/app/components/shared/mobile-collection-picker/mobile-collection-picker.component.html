<section class="mobile-view-picker" [attr.aria-label]="ariaLabel()">
  <h1 class="mobile-view-picker__title">{{ title() }}</h1>
  @for (option of options(); track option.value) { @let preview =
  previews().get(option.value);
  <button
    type="button"
    class="mobile-view-selection"
    (click)="selected.emit(option.value)"
  >
    @if (preview?.coverUrl) {
    <img
      class="mobile-view-selection__cover"
      [src]="preview?.coverUrl"
      [alt]="'Couverture de ' + (preview?.title ?? option.label)"
    />
    } @else {
    <span
      class="mobile-view-selection__cover mobile-view-selection__cover--empty"
      aria-hidden="true"
      >{{ emptyIcon() }}</span
    >
    }
    <span class="mobile-view-selection__copy">
      <span class="mobile-view-selection__label">{{ option.label }}</span>
    </span>
    <svg
      class="mobile-view-selection__chevron"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M9 6l6 6-6 6"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  }
</section>
