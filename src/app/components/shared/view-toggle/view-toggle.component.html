<div
  class="view-toggle-root"
  [class.view-toggle-root--panel-open]="expanded()"
>
  <div class="view-toggle-desktop" [ngClass]="toggleClass">
    @for (option of options; track option.value) {
    <button
      type="button"
      class="toggle-option"
      [class.active]="selected === option.value"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
    }
  </div>

  <div class="view-toggle-mobile" [ngClass]="toggleClass">
    <button
      type="button"
      class="view-toggle-mobile-trigger"
      [class.view-toggle-mobile-trigger--open]="expanded()"
      [attr.aria-expanded]="expanded()"
      aria-haspopup="listbox"
      [attr.aria-controls]="mobilePanelId"
      [attr.aria-label]="'Vue : ' + selectedLabel"
      (click)="toggleMenu()"
    >
      <span class="view-toggle-burger" aria-hidden="true">
        <span class="view-toggle-burger__bar"></span>
        <span class="view-toggle-burger__bar"></span>
        <span class="view-toggle-burger__bar"></span>
      </span>
      <span class="view-toggle-mobile-trigger__label">{{ selectedLabel }}</span>
      <span class="view-toggle-mobile-trigger__chevron" aria-hidden="true"></span>
    </button>

    @if (expanded()) {
    <div
      class="view-toggle-mobile-panel"
      [id]="mobilePanelId"
      role="listbox"
      aria-label="Choisir une vue"
    >
      @for (option of options; track option.value) {
      <button
        type="button"
        role="option"
        [attr.aria-selected]="selected === option.value"
        class="toggle-option-mobile"
        [class.active]="selected === option.value"
        (click)="select(option.value)"
      >
        {{ option.label }}
      </button>
      }
    </div>
    }
  </div>
</div>
