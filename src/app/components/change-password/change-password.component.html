<app-menu></app-menu>

<div class="change-password-container">
  <div class="change-password-card">
    <p class="change-password-title">Modifier mon mot de passe</p>

    @if (authenticatedUser()) {
    <p class="change-password-subtitle">
      Connecté en tant que <strong>{{ authenticatedUser() }}</strong>
    </p>
    }

    <div class="change-password-field">
      <label for="old-password">Mot de passe actuel</label>
      <input
        id="old-password"
        type="password"
        autocomplete="current-password"
        placeholder="Mot de passe actuel"
        [ngModel]="oldPassword()"
        (ngModelChange)="onOldPasswordChange($event)"
        (keydown.enter)="onSubmit()"
      />
    </div>

    <div class="change-password-field">
      <label for="new-password">Nouveau mot de passe</label>
      <input
        id="new-password"
        type="password"
        autocomplete="new-password"
        placeholder="Nouveau mot de passe"
        [ngModel]="newPassword()"
        (ngModelChange)="onNewPasswordChange($event)"
        (keydown.enter)="onSubmit()"
      />
    </div>

    <div class="change-password-field">
      <label for="confirm-password">Confirmer le nouveau mot de passe</label>
      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        placeholder="Confirmer le nouveau mot de passe"
        [ngModel]="confirmPassword()"
        (ngModelChange)="onConfirmPasswordChange($event)"
        (keydown.enter)="onSubmit()"
      />
    </div>

    @if (errorMessage()) {
    <p class="change-password-error" role="alert">{{ errorMessage() }}</p>
    } @if (successMessage()) {
    <p class="change-password-success" role="status">
      {{ successMessage() }}
    </p>
    }

    <div class="change-password-actions">
      <button
        type="button"
        class="change-password-cancel"
        (click)="cancel()"
        [disabled]="isLoading()"
      >
        Annuler
      </button>
      <button
        type="button"
        class="change-password-submit"
        (click)="onSubmit()"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Mise à jour…' : 'Modifier mon mot de passe' }}
      </button>
    </div>
  </div>
</div>
