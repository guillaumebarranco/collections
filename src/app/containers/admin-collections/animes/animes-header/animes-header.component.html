<div class="animes-header">
  <h1>Animés ({{ filteredAnimesCount() }})</h1>

  <button class="makya-btn" (click)="openAddAnimeAdminDialog()">
    Créer une nouvelle animé
  </button>

  <div class="animes-header-top">
    <app-view-toggle
      [toggleClass]="'animes-view-toggle'"
      [options]="viewOptions()"
      [selected]="selectedView()"
      (selectedChange)="onViewChange.emit($any($event))"
    ></app-view-toggle>
  </div>

  <div class="entity-input-search">
    <input
      type="text"
      placeholder="Rechercher par titre, réalisateur, acteur..."
      [ngModel]="searchTerm()"
      (ngModelChange)="onSearchChange.emit($event)"
    />
  </div>
</div>
