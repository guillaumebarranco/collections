<app-menu></app-menu>

<div class="comics-container">
  <app-comics-header
    [selectedView]="selectedView()"
    [selectedSortInput]="selectedSort()"
    [searchTermInput]="searchTerm()"
    [filteredComicsCount]="filteredComics().length"
    [allComicsCount]="allComics().length"
    [allReadlistComicsCount]="allReadlistComics().length"
    [stats]="stats()"
    [viewOptions]="viewOptions"
    [sortOptions]="sortOptions()"
    (onViewChange)="onViewChange($any($event))"
    (onSearchChange)="onSearchChange($event)"
    (onSortChange)="onSortChange($event)"
  ></app-comics-header>

  <div class="comics">
    @for (comic of sortedComics(); track comic.title) {
    <div class="comic-card">
      <app-comic
        [comic]="comic"
        [quizzs]="quizzs()"
        (editRequested)="openEditComicDialog(comic)"
        (openQuizz)="openQuizzModal($event)"
      ></app-comic>
    </div>
    }
  </div>
</div>

<app-quizz-modal
  [isOpen]="isQuizzModalOpen()"
  [quizzs]="activeQuizzs()"
  (close)="closeQuizzModal()"
></app-quizz-modal>
