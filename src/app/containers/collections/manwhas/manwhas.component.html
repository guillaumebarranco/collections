<app-menu></app-menu>

<div class="manwhas-container">
  <h1>Manwhas lus ({{ allManwhas().length }})</h1>

  @if(allManwhas().length === 0) {
  <div class="empty-state">
    <p class="empty-message">Vous n'avez aucun manwha dans votre collection.</p>
    <p class="empty-subtitle">
      Commencez dès maintenant à créer votre manhwathèque personnelle !
    </p>
    <button class="btn btn-primary" [routerLink]="getSelectManwhasRoute()">
      Sélectionner mes manwhas
    </button>
  </div>
  }

  @if(allManwhas().length !== 0) {
  <div class="manwhas-header-top">
    <div class="manwhas-actions">
      <button
        class="btn btn-small"
        [routerLink]="getSelectManwhasRoute()"
        title="Ajouter des manwhas"
      >
        ➕ Ajouter des manwhas
      </button>
      <button
        class="btn btn-small"
        [routerLink]="getSelectManwhasRatingRoute()"
        title="Mettre à jour les notes de mes manwhas"
      >
        ⭐ Notes
      </button>
      <button
        class="btn btn-small"
        [routerLink]="getSelectManwhasTimesReadRoute()"
        title="Mettre à jour le nombre de lectures de mes manwhas"
      >
        📖 Lectures
      </button>
    </div>
  </div>
  }

  <div class="manwhas-header">
    <app-stats-display
      [stats]="stats()"
      [count]="allManwhas().length"
      countLabel="manwhas"
    >
    </app-stats-display>

    <app-sort-dropdown
      [sortOptions]="sortOptions()"
      [selectedSort]="selectedSort()"
      (sortChange)="onSortChange($event)"
    >
    </app-sort-dropdown>
  </div>

  <div class="manwhas">
    @for (manwha of sortedManwhas(); track manwha.title) {
    <div class="manwha-card">
      <app-book
        [book]="manwha"
        (editRequested)="openEditManwhaDialog(manwha)"
      ></app-book>
    </div>
    }
  </div>
</div>
