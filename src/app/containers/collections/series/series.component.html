<app-menu></app-menu>

<div class="series-container">
  <app-series-header
    [selectedView]="selectedView()"
    [selectedSortInput]="selectedSort()"
    [searchTermInput]="searchTerm()"
    [filteredSeriesCount]="filteredSeries().length"
    [allSeriesCount]="allSeries().length"
    [stats]="stats()"
    [viewOptions]="viewOptions"
    [sortOptions]="sortOptions()"
    (onViewChange)="onViewChange($any($event))"
    (onSearchChange)="onSearchChange($event)"
    (onSortChange)="onSortChange($event)"
  ></app-series-header>

  <div class="series">
    @for (serie of sortedSeries(); track serie.title; let i = $index) {
    <div class="serie-card">
      <app-serie
        [serie]="serie"
        [list]="sortedSeries()"
        [index]="i"
        [quizzs]="quizzs()"
        (serieUpdated)="refreshSeries()"
        (openQuizz)="openQuizzModal($event)"
      ></app-serie>
    </div>
    }
  </div>
</div>

<app-quizz-modal
  [isOpen]="isQuizzModalOpen()"
  [quizzs]="activeQuizzs()"
  (close)="closeQuizzModal()"
></app-quizz-modal>
