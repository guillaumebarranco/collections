<app-menu></app-menu>

<div class="mangas-container">
  <app-mangas-header
    [selectedView]="selectedView()"
    [selectedSortInput]="selectedSort()"
    [searchTermInput]="searchTerm()"
    [filteredMangasCount]="filteredMangas().length"
    [allMangasCount]="allMangas().length"
    [allReadlistMangasCount]="allReadlistMangas().length"
    [stats]="stats()"
    [viewOptions]="viewOptions"
    [sortOptions]="sortOptions()"
    (onViewChange)="onViewChange($any($event))"
    (onSearchChange)="onSearchChange($event)"
    (onSortChange)="onSortChange($event)"
  ></app-mangas-header>

  <div class="mangas">
    @for (manga of sortedMangas(); track manga.title) {
    <div class="manga-card">
      <app-manga
        [manga]="manga"
        [quizzs]="quizzs()"
        (editRequested)="openEditMangaDialog(manga)"
        (openQuizz)="openQuizzModal($event)"
      ></app-manga>
    </div>
    }
  </div>
</div>

<app-quizz-modal
  [isOpen]="isQuizzModalOpen()"
  [quizzs]="activeQuizzs()"
  (close)="closeQuizzModal()"
></app-quizz-modal>
