<app-menu></app-menu>

<div class="games-container">
  <app-games-header
    [selectedView]="selectedView()"
    [selectedSortInput]="selectedSort()"
    [searchTermInput]="searchTerm()"
    [filteredGamesCount]="filteredGames().length"
    [allGamesCount]="allGames().length"
    [allGamelistGamesCount]="allGamelistGames().length"
    [stats]="stats()"
    [viewOptions]="viewOptions()"
    [sortOptions]="sortOptions()"
    (onViewChange)="onViewChange($any($event))"
    (onSearchChange)="onSearchChange($event)"
    (onSortChange)="onSortChange($event)"
  ></app-games-header>

  <div class="games">
    @for (game of sortedGames(); track game.title; let i = $index) {
    <div class="game-card">
      <app-game
        [game]="game"
        [list]="sortedGames()"
        [index]="i"
        [quizzs]="quizzs()"
        (gameUpdated)="refreshGames()"
        (openQuizz)="openQuizzModal($event)"
      ></app-game>
    </div>
    }
  </div>
</div>

<app-quizz-modal
  [isOpen]="isQuizzModalOpen()"
  [quizzs]="activeQuizzs()"
  (close)="closeQuizzModal()"
></app-quizz-modal>
