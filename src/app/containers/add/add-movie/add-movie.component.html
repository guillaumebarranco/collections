<div class="add-movie">
  <div class="header">
    <h1>Ajouter un film</h1>
    <button type="button" class="close-btn" (click)="close()">✕</button>
  </div>

  <form class="add-form" (ngSubmit)="onSubmit()">
    <section class="form-section">
      <h2>Informations du film</h2>

      <div class="form-row">
        <label for="title">Titre</label>
        <input
          id="title"
          type="text"
          [ngModel]="entityForm().title"
          (ngModelChange)="updateEntityField('title', $event)"
          name="title"
          required
        />
      </div>

      <div class="form-row">
        <label for="director">Réalisateur</label>
        <input
          id="director"
          type="text"
          [ngModel]="entityForm().director"
          (ngModelChange)="updateEntityField('director', $event)"
          name="director"
          required
        />
      </div>

      <div class="form-row">
        <label for="actors">Acteurs (séparés par des virgules)</label>
        <input
          id="actors"
          type="text"
          [ngModel]="entityForm().actors"
          (ngModelChange)="updateEntityField('actors', $event)"
          name="actors"
        />
      </div>

      <div class="form-row">
        <label for="coverUrl">Cover URL</label>
        <input
          id="coverUrl"
          type="text"
          [ngModel]="entityForm().coverUrl"
          (ngModelChange)="updateEntityField('coverUrl', $event)"
          name="coverUrl"
        />
      </div>

      <div class="form-row">
        <label for="releaseDate">Date de sortie</label>
        <input
          id="releaseDate"
          type="date"
          [ngModel]="entityForm().releaseDate"
          (ngModelChange)="updateEntityField('releaseDate', $event)"
          name="releaseDate"
        />
      </div>

      <div class="form-row">
        <label for="length">Durée (min)</label>
        <input
          id="length"
          type="number"
          min="0"
          [ngModel]="entityForm().length"
          (ngModelChange)="updateEntityField('length', $event)"
          name="length"
        />
      </div>

      <div class="form-row genre-row">
        <mat-form-field appearance="outline" class="genre-field">
          <mat-label>Genres</mat-label>
          <mat-select
            id="genre"
            multiple
            panelClass="makya-mat-select-panel-dark"
            [ngModel]="entityForm().genre"
            (ngModelChange)="setGenres($event)"
            name="genre"
            placeholder="Sélectionner un ou plusieurs genres"
          >
            @for (g of movieGenreOptions; track g) {
              <mat-option [value]="g">{{ g }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-row">
        <label for="saga">Saga</label>
        <input
          id="saga"
          type="text"
          [ngModel]="entityForm().saga"
          (ngModelChange)="updateEntityField('saga', $event)"
          name="saga"
        />
      </div>

      <div class="form-row">
        <label for="countryOrigin">Nationalité du film</label>
        <app-country-select
          inputId="countryOrigin"
          name="countryOrigin"
          [value]="entityForm().countryOrigin"
          (valueChange)="updateEntityField('countryOrigin', $event)"
        />
      </div>
    </section>

    @if(getUserId() !== 'admin') {
    <section class="form-section">
      <h2>Informations utilisateur</h2>

      <div class="form-row">
        <label>Note</label>
        <div class="rating-control">
          <button
            *ngFor="let star of [1, 2, 3, 4, 5]"
            type="button"
            class="star-btn"
            (click)="setRatingFromClick(star, $event)"
          >
            <span
              class="star"
              [class.star-full]="
                getStarType(userForm().rating || 0, star) === 'full'
              "
              [class.star-threeQuarter]="
                getStarType(userForm().rating || 0, star) === 'threeQuarter'
              "
              [class.star-half]="
                getStarType(userForm().rating || 0, star) === 'half'
              "
              [class.star-quarter]="
                getStarType(userForm().rating || 0, star) === 'quarter'
              "
              [class.star-empty]="
                getStarType(userForm().rating || 0, star) === 'empty'
              "
            >
              ★
            </span>
          </button>
          <input
            type="number"
            min="0"
            max="5"
            step="0.25"
            [ngModel]="userForm().rating"
            (ngModelChange)="updateUserField('rating', $event)"
            name="rating"
            class="rating-input"
            aria-label="Note numérique"
          />
          <span class="rating-value">{{ userForm().rating }}/5</span>
        </div>
      </div>

      <div class="form-row">
        <label for="timesWatched">Visionnages</label>
        <input
          id="timesWatched"
          type="number"
          min="0"
          [ngModel]="userForm().timesWatched"
          (ngModelChange)="updateUserField('timesWatched', $event)"
          name="timesWatched"
        />
      </div>

      <div class="form-row">
        <label for="firstViewedDate">Premier visionnage</label>
        <input
          id="firstViewedDate"
          type="date"
          [ngModel]="userForm().firstViewedDate"
          (ngModelChange)="updateUserField('firstViewedDate', $event)"
          name="firstViewedDate"
        />
      </div>

      <div class="form-row">
        <label for="lastViewedDate">Dernier visionnage</label>
        <input
          id="lastViewedDate"
          type="date"
          [ngModel]="userForm().lastViewedDate"
          (ngModelChange)="updateUserField('lastViewedDate', $event)"
          name="lastViewedDate"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="seenAtCinema">Vu au cinéma</label>
        <input
          id="seenAtCinema"
          type="checkbox"
          [checked]="userForm().seenAtCinema"
          (change)="updateCheckbox('seenAtCinema', $any($event).target.checked)"
          name="seenAtCinema"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="owned">Possédé</label>
        <input
          id="owned"
          type="checkbox"
          [checked]="userForm().owned"
          (change)="updateCheckbox('owned', $any($event).target.checked)"
          name="owned"
        />
      </div>
      <div class="form-row">
        <label for="borrowed">Emprunté à</label>
        <input
          id="borrowed"
          type="text"
          [ngModel]="userForm().borrowed"
          (ngModelChange)="updateUserField('borrowed', $event)"
          name="borrowed"
        />
      </div>
      <div class="form-row">
        <label for="loaned">Prêté à</label>
        <input
          id="loaned"
          type="text"
          [ngModel]="userForm().loaned"
          (ngModelChange)="updateUserField('loaned', $event)"
          name="loaned"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="wantToSeeAgain">Voir à nouveau</label>
        <input
          id="wantToSeeAgain"
          type="checkbox"
          [checked]="userForm().wantToSeeAgain"
          (change)="updateCheckbox('wantToSeeAgain', $any($event).target.checked)"
          name="wantToSeeAgain"
        />
      </div>

      <div class="form-row">
        <label for="watchPriority">Priorité dans la watchlist</label>
        <input
          id="watchPriority"
          type="number"
          [ngModel]="userForm().watchPriority"
          (ngModelChange)="updateUserField('watchPriority', $event)"
          name="watchPriority"
          min="0"
        />
      </div>
    </section>
    } @if(errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
    }

    <div class="actions">
      <button type="button" class="btn secondary" (click)="close()">
        Annuler
      </button>
      <button type="submit" class="btn primary" [disabled]="isSaving()">
        {{ isSaving() ? "Ajout..." : "Ajouter" }}
      </button>
    </div>
  </form>
</div>
