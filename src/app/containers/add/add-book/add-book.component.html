<div class="add-book">
  <div class="header">
    <h1>Ajouter un livre</h1>
    <button type="button" class="close-btn" (click)="close()">✕</button>
  </div>

  <form class="add-form" (ngSubmit)="onSubmit()">
    <section class="form-section">
      <h2>Informations du livre</h2>

      <div class="form-row">
        <label for="title">Titre</label>
        <input
          id="title"
          type="text"
          [ngModel]="entityForm().title"
          (ngModelChange)="updateEntityField('title', $event)"
          name="title"
          required
        />
      </div>

      <div class="form-row">
        <label for="author">Auteur</label>
        <input
          id="author"
          type="text"
          [ngModel]="entityForm().author"
          (ngModelChange)="updateEntityField('author', $event)"
          name="author"
          required
        />
      </div>

      <div class="form-row">
        <label for="coverUrl">Cover URL</label>
        <input
          id="coverUrl"
          type="text"
          [ngModel]="entityForm().coverUrl"
          (ngModelChange)="updateEntityField('coverUrl', $event)"
          name="coverUrl"
        />
      </div>

      <div class="form-row">
        <label for="pages">Pages</label>
        <input
          id="pages"
          type="number"
          min="0"
          [ngModel]="entityForm().pages"
          (ngModelChange)="updateEntityField('pages', $event)"
          name="pages"
        />
      </div>

      <div class="form-row">
        <label for="genre">Genre</label>
        <input
          id="genre"
          type="text"
          [ngModel]="entityForm().genre"
          (ngModelChange)="updateEntityField('genre', $event)"
          name="genre"
        />
      </div>

      <div class="form-row">
        <label for="saga">Saga</label>
        <input
          id="saga"
          type="text"
          [ngModel]="entityForm().saga"
          (ngModelChange)="updateEntityField('saga', $event)"
          name="saga"
        />
      </div>

      <div class="form-row">
        <label for="sagaOrder">Ordre dans la saga</label>
        <input
          id="sagaOrder"
          type="number"
          min="0"
          [ngModel]="entityForm().sagaOrder"
          (ngModelChange)="updateEntityField('sagaOrder', $event)"
          name="sagaOrder"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="sagaFinished">Saga terminée</label>
        <input
          id="sagaFinished"
          type="checkbox"
          [checked]="entityForm().sagaFinished"
          (change)="updateCheckbox('sagaFinished', $any($event).target.checked)"
          name="sagaFinished"
        />
      </div>

      <div class="form-row">
        <label for="releaseDate">Date de sortie</label>
        <input
          id="releaseDate"
          type="date"
          [ngModel]="entityForm().releaseDate"
          (ngModelChange)="updateEntityField('releaseDate', $event)"
          name="releaseDate"
        />
      </div>

      <div class="form-row">
        <label for="countryOrigin">Pays d'origine</label>
        <app-country-select
          inputId="countryOrigin"
          name="countryOrigin"
          [value]="entityForm().countryOrigin"
          (valueChange)="updateEntityField('countryOrigin', $event)"
        />
      </div>
    </section>

    @if(getUserId() !== 'admin') {
    <section class="form-section">
      <h2>Informations utilisateur</h2>

      <div class="form-row">
        <label>Note</label>
        <div class="rating-control">
          <button
            *ngFor="let star of [1, 2, 3, 4, 5]"
            type="button"
            class="star-btn"
            (click)="setRatingFromClick(star, $event)"
          >
            <span
              class="star"
              [class.star-full]="
                getStarType(userForm().rating || 0, star) === 'full'
              "
              [class.star-half]="
                getStarType(userForm().rating || 0, star) === 'half'
              "
              [class.star-empty]="
                getStarType(userForm().rating || 0, star) === 'empty'
              "
            >
              ★
            </span>
          </button>
          <span class="rating-value">{{ userForm().rating }}/5</span>
        </div>
      </div>

      <div class="form-row">
        <label for="readTimes">Relectures</label>
        <input
          id="readTimes"
          type="number"
          min="0"
          [ngModel]="userForm().readTimes"
          (ngModelChange)="updateUserField('readTimes', $event)"
          name="readTimes"
        />
      </div>

      <div class="form-row">
        <label for="readDate">Date de lecture</label>
        <input
          id="readDate"
          type="date"
          [ngModel]="userForm().readDate"
          (ngModelChange)="updateUserField('readDate', $event)"
          name="readDate"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="owned">Possédé</label>
        <input
          id="owned"
          type="checkbox"
          [checked]="userForm().owned"
          (change)="updateUserCheckbox('owned', $any($event).target.checked)"
          name="owned"
        />
      </div>

      <div class="form-row">
        <label for="readPriority">Priorité dans la readlist</label>
        <input
          id="readPriority"
          type="number"
          [ngModel]="userForm().readPriority"
          (ngModelChange)="updateUserField('readPriority', $event)"
          name="readPriority"
          min="0"
        />
      </div>
    </section>
    } @if(errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
    }

    <div class="actions">
      <button type="button" class="btn secondary" (click)="close()">
        Annuler
      </button>
      <button type="submit" class="btn primary" [disabled]="isSaving()">
        {{ isSaving() ? "Ajout..." : "Ajouter" }}
      </button>
    </div>
  </form>
</div>
