<div class="add-game">
  <div class="header">
    <h1>Ajouter un jeu</h1>
    <button type="button" class="close-btn" (click)="close()">&#10005;</button>
  </div>

  <form class="add-form" (ngSubmit)="onSubmit()">
    <section class="form-section">
      <h2>Informations du jeu</h2>

      <div class="form-row">
        <label for="title">Titre</label>
        <input
          id="title"
          type="text"
          [ngModel]="entityForm().title"
          (ngModelChange)="updateEntityField('title', $event)"
          name="title"
          required
        />
      </div>

      <div class="form-row">
        <label for="editor">Editeur</label>
        <input
          id="editor"
          type="text"
          [ngModel]="entityForm().editor"
          (ngModelChange)="updateEntityField('editor', $event)"
          name="editor"
          required
        />
      </div>

      <div class="form-row">
        <label for="hero">Hero</label>
        <input
          id="hero"
          type="text"
          [ngModel]="entityForm().hero"
          (ngModelChange)="updateEntityField('hero', $event)"
          name="hero"
        />
      </div>

      <div class="form-row">
        <label for="coverUrl">Cover URL</label>
        <input
          id="coverUrl"
          type="text"
          [ngModel]="entityForm().coverUrl"
          (ngModelChange)="updateEntityField('coverUrl', $event)"
          name="coverUrl"
        />
      </div>

      <div class="form-row">
        <label for="releaseDate">Date de sortie</label>
        <input
          id="releaseDate"
          type="date"
          [ngModel]="entityForm().releaseDate"
          (ngModelChange)="updateEntityField('releaseDate', $event)"
          name="releaseDate"
        />
      </div>

      <div class="form-row">
        <label for="averageTimeToFinish">Temps moyen (h)</label>
        <input
          id="averageTimeToFinish"
          type="number"
          min="0"
          [ngModel]="entityForm().averageTimeToFinish"
          (ngModelChange)="updateEntityField('averageTimeToFinish', $event)"
          name="averageTimeToFinish"
        />
      </div>

      <div class="form-row">
        <label for="platform">Plateforme</label>
        <input
          id="platform"
          type="text"
          [ngModel]="entityForm().platform"
          (ngModelChange)="updateEntityField('platform', $event)"
          name="platform"
        />
      </div>

      <div class="form-row">
        <label for="saga">Saga</label>
        <input
          id="saga"
          type="text"
          [ngModel]="entityForm().saga"
          (ngModelChange)="updateEntityField('saga', $event)"
          name="saga"
        />
      </div>

      <div class="form-row">
        <label for="platineTime">Temps platine (h)</label>
        <input
          id="platineTime"
          type="number"
          min="0"
          [ngModel]="entityForm().platineTime"
          (ngModelChange)="updateEntityField('platineTime', $event)"
          name="platineTime"
        />
      </div>
    </section>

    <section class="form-section">
      <h2>Informations utilisateur</h2>

      <div class="form-row">
        <label>Note</label>
        <div class="rating-control">
          <button
            *ngFor="let star of [1, 2, 3, 4, 5]"
            type="button"
            class="star-btn"
            (click)="setRatingFromClick(star, $event)"
          >
            <span
              class="star"
              [class.star-full]="
                getStarType(userForm().rating || 0, star) === 'full'
              "
              [class.star-half]="
                getStarType(userForm().rating || 0, star) === 'half'
              "
              [class.star-empty]="
                getStarType(userForm().rating || 0, star) === 'empty'
              "
            >
              &#9733;
            </span>
          </button>
          <span class="rating-value">{{ userForm().rating }}/5</span>
        </div>
      </div>

      <div class="form-row">
        <label for="timesFinished">Termines</label>
        <input
          id="timesFinished"
          type="number"
          min="0"
          [ngModel]="userForm().timesFinished"
          (ngModelChange)="updateUserField('timesFinished', $event)"
          name="timesFinished"
        />
      </div>

      <div class="form-row">
        <label for="additionnalEstimatedTime">Temps additionnel (h)</label>
        <input
          id="additionnalEstimatedTime"
          type="number"
          min="0"
          [ngModel]="userForm().additionnalEstimatedTime"
          (ngModelChange)="updateUserField('additionnalEstimatedTime', $event)"
          name="additionnalEstimatedTime"
        />
      </div>
      <div class="form-row">
        <label for="timesFinishedHundredPercent">Terminé à 100%</label>
        <input
          id="timesFinishedHundredPercent"
          type="number"
          min="0"
          [ngModel]="userForm().timesFinishedHundredPercent"
          (ngModelChange)="
            updateUserField('timesFinishedHundredPercent', $event)
          "
          name="timesFinishedHundredPercent"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="platined">Platined</label>
        <input
          id="platined"
          type="checkbox"
          [checked]="userForm().platined"
          (change)="updateCheckbox('platined', $any($event).target.checked)"
          name="platined"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="owned">Possédé</label>
        <input
          id="owned"
          type="checkbox"
          [checked]="userForm().owned"
          (change)="updateCheckbox('owned', $any($event).target.checked)"
          name="owned"
        />
      </div>
    </section>

    @if(errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
    }

    <div class="actions">
      <button type="button" class="btn secondary" (click)="close()">
        Annuler
      </button>
      <button type="submit" class="btn primary" [disabled]="isSaving()">
        {{ isSaving() ? "Ajout..." : "Ajouter" }}
      </button>
    </div>
  </form>
</div>
