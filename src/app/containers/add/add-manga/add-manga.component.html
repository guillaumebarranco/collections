<div class="add-manga">
  <div class="header">
    <h1>Ajouter un manga</h1>
    <button type="button" class="close-btn" (click)="close()">✕</button>
  </div>

  <form class="add-form" (ngSubmit)="onSubmit()">
    <section class="form-section">
      <h2>Informations du manga</h2>

      <div class="form-row">
        <label for="title">Titre</label>
        <input
          id="title"
          type="text"
          [ngModel]="entityForm().title"
          (ngModelChange)="updateEntityField('title', $event)"
          name="title"
          required
        />
      </div>

      <div class="form-row">
        <label for="author">Auteur</label>
        <input
          id="author"
          type="text"
          [ngModel]="entityForm().author"
          (ngModelChange)="updateEntityField('author', $event)"
          name="author"
          required
        />
      </div>

      <div class="form-row">
        <label for="coverUrl">Cover URL</label>
        <input
          id="coverUrl"
          type="text"
          [ngModel]="entityForm().coverUrl"
          (ngModelChange)="updateEntityField('coverUrl', $event)"
          name="coverUrl"
        />
      </div>

      <div class="form-row">
        <label for="genre">Genre</label>
        <input
          id="genre"
          type="text"
          [ngModel]="entityForm().genre"
          (ngModelChange)="updateEntityField('genre', $event)"
          name="genre"
        />
      </div>

      <div class="form-row">
        <label for="nbTomes">Nombre de tomes</label>
        <input
          id="nbTomes"
          type="number"
          min="0"
          [ngModel]="entityForm().nbTomes"
          (ngModelChange)="updateEntityField('nbTomes', $event)"
          name="nbTomes"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="isFinished">Série terminée</label>
        <input
          id="isFinished"
          type="checkbox"
          [checked]="entityForm().isFinished"
          (change)="updateCheckbox('isFinished', $any($event).target.checked)"
          name="isFinished"
        />
      </div>
    </section>

    <section class="form-section">
      <h2>Informations utilisateur</h2>

      <div class="form-row">
        <label>Note</label>
        <div class="rating-control">
          <button
            *ngFor="let star of [1, 2, 3, 4, 5]"
            type="button"
            class="star-btn"
            (click)="setRatingFromClick(star, $event)"
          >
            <span
              class="star"
              [class.star-full]="
                getStarType(userForm().rating || 0, star) === 'full'
              "
              [class.star-threeQuarter]="
                getStarType(userForm().rating || 0, star) === 'threeQuarter'
              "
              [class.star-half]="
                getStarType(userForm().rating || 0, star) === 'half'
              "
              [class.star-quarter]="
                getStarType(userForm().rating || 0, star) === 'quarter'
              "
              [class.star-empty]="
                getStarType(userForm().rating || 0, star) === 'empty'
              "
            >
              ★
            </span>
          </button>
          <input
            type="number"
            min="0"
            max="5"
            step="0.25"
            [ngModel]="userForm().rating"
            (ngModelChange)="updateUserField('rating', $event)"
            name="rating"
            class="rating-input"
            aria-label="Note numérique"
          />
          <span class="rating-value">{{ userForm().rating }}/5</span>
        </div>
      </div>

      <div class="form-row">
        <label for="readTimes">Relectures</label>
        <input
          id="readTimes"
          type="number"
          min="0"
          [ngModel]="userForm().readTimes"
          (ngModelChange)="updateUserField('readTimes', $event)"
          name="readTimes"
        />
      </div>

      <div class="form-row">
        <label for="readDate">Date de lecture</label>
        <input
          id="readDate"
          type="date"
          [ngModel]="userForm().readDate"
          (ngModelChange)="updateUserField('readDate', $event)"
          name="readDate"
        />
      </div>

      <div class="form-row checkbox-row">
        <label for="owned">Possédé</label>
        <input
          id="owned"
          type="checkbox"
          [checked]="userForm().owned"
          (change)="updateUserCheckbox('owned', $any($event).target.checked)"
          name="owned"
        />
      </div>
    </section>

    @if(errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
    }

    <div class="actions">
      <button type="button" class="btn secondary" (click)="close()">
        Annuler
      </button>
      <button type="submit" class="btn primary" [disabled]="isSaving()">
        {{ isSaving() ? 'Ajout...' : 'Ajouter' }}
      </button>
    </div>
  </form>
</div>
