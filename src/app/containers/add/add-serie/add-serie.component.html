<div class="add-serie">
  <div class="header">
    <h1>Ajouter une série</h1>
    <button type="button" class="close-btn" (click)="close()">✕</button>
  </div>

  <form class="add-form" (ngSubmit)="onSubmit()">
    <section class="form-section">
      <h2>Informations de la série</h2>

      <div class="form-row">
        <label for="title">Titre</label>
        <input
          id="title"
          type="text"
          [ngModel]="entityForm().title"
          (ngModelChange)="updateEntityField('title', $event)"
          name="title"
          required
        />
      </div>

      <div class="form-row">
        <label for="director">Créateur</label>
        <input
          id="director"
          type="text"
          [ngModel]="entityForm().director"
          (ngModelChange)="updateEntityField('director', $event)"
          name="director"
          required
        />
      </div>

      <div class="form-row">
        <label for="actors">Acteurs (séparés par des virgules)</label>
        <input
          id="actors"
          type="text"
          [ngModel]="entityForm().actors"
          (ngModelChange)="updateEntityField('actors', $event)"
          name="actors"
        />
      </div>

      <div class="form-row">
        <label for="coverUrl">Cover URL</label>
        <input
          id="coverUrl"
          type="text"
          [ngModel]="entityForm().coverUrl"
          (ngModelChange)="updateEntityField('coverUrl', $event)"
          name="coverUrl"
        />
      </div>

      <div class="form-row">
        <label for="releaseDate">Date de sortie</label>
        <input
          id="releaseDate"
          type="date"
          [ngModel]="entityForm().releaseDate"
          (ngModelChange)="updateEntityField('releaseDate', $event)"
          name="releaseDate"
        />
      </div>

      <div class="form-row">
        <label for="endDate">Date de fin</label>
        <input
          id="endDate"
          type="date"
          [ngModel]="entityForm().endDate"
          (ngModelChange)="updateEntityField('endDate', $event)"
          name="endDate"
        />
      </div>

      <div class="form-row">
        <label for="nbSeasons">Saisons</label>
        <input
          id="nbSeasons"
          type="number"
          min="0"
          [ngModel]="entityForm().nbSeasons"
          (ngModelChange)="updateEntityField('nbSeasons', $event)"
          name="nbSeasons"
        />
      </div>

      <div class="form-row">
        <label for="nbEpisodesTotal">Épisodes</label>
        <input
          id="nbEpisodesTotal"
          type="number"
          min="0"
          [ngModel]="entityForm().nbEpisodesTotal"
          (ngModelChange)="updateEntityField('nbEpisodesTotal', $event)"
          name="nbEpisodesTotal"
        />
      </div>

      <div class="form-row">
        <label for="totalLength">Durée totale (min)</label>
        <input
          id="totalLength"
          type="number"
          min="0"
          [ngModel]="entityForm().totalLength"
          (ngModelChange)="updateEntityField('totalLength', $event)"
          name="totalLength"
        />
      </div>

      <div class="form-row">
        <label for="genre">Genre</label>
        <input
          id="genre"
          type="text"
          [ngModel]="entityForm().genre"
          (ngModelChange)="updateEntityField('genre', $event)"
          name="genre"
        />
      </div>
    </section>

    @if(errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
    }

    <div class="actions">
      <button type="button" class="btn secondary" (click)="close()">
        Annuler
      </button>
      <button type="submit" class="btn primary" [disabled]="isSaving()">
        {{ isSaving() ? 'Ajout...' : 'Ajouter' }}
      </button>
    </div>
  </form>
</div>
